    <header class="header">
        <div class="logo-text">
            <h1>Tech<span>Wave</span></h1>

                <li><a href="#">About</a></li>
                <li><a href="#">Episodes</a></li>

        </nav>
            <button class="sub-btn gradient-btn">Subscribe <img src="/Media/arrow.svg" alt=""></button>

        <section class="hero-container">
            <div class="main-design">
                <div class="illustration">

                <div class="content">
                    <div class="text">
                        <h2>TechWave</h2>
                        <p>Your daily dose of tech insights, productivity hacks, and personal growth.</p>
                    </div>
                    <div class="btn">
                        <a href="#"><img src="Media/spotify.svg" alt="spotify-logo">Listen On Spotify</a>
                        <a href="#"><img src="Media/message.png" alt="envelop-icon"></a>
                    </div>
                </div>
            </div>
        </section>
    </main>
